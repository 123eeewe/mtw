[package]
name = "mousetweaks_rs"
version = "1.0.0"
edition = "2021"
description = "MouseTweaks-аналог для Horizon (Minecraft): скролл-руки, перетаскивание ЛКМ/ПКМ по слотам инвентаря, отмена «жесткого» броска стака."
license = "MIT"
authors = ["you"]

[lib]
name = "mousetweaks_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
